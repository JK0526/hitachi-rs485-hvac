name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest and branch coverage (minimum 95%)
        run: pytest
      - name: Monitor frontend
        run: node --test tests/frontend/monitor.test.cjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage.json
