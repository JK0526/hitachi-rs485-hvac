[project]
name = "hitachi-rs485-hvac"
version = "0.1.1rc2"
requires-python = ">=3.14.2"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.372", "pytest-cov==7.1.0", "ruff==0.17.0", "home-assistant-frontend==20260930.3"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=custom_components.hitachi_rs485 --cov-branch --cov-report=term-missing --cov-report=json --cov-fail-under=95"

[tool.ruff]
target-version = "py314"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
